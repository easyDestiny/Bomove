<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bomove · 나의 책·드라마·영화 컬렉션</title>
  <!-- 종이책 느낌의 한글 글씨체 (고운바탕) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 맨 위 제목 영역 -->
  <header class="top">
    <h1>Bomove</h1>
    <p class="subtitle">내가 모은 책 · 드라마 · 영화</p>
    <div class="stats" id="stats"></div>
  </header>

  <!-- 종류 고르는 탭 -->
  <nav class="main-tabs" id="tabs">
    <button data-tab="book" class="active">📚 책</button>
    <button data-tab="drama">📺 드라마</button>
    <button data-tab="movie">🎬 영화</button>
    <button data-tab="calendar">📅 달력</button>
  </nav>

  <main>
    <!-- 책 / 드라마 / 영화 컬렉션 -->
    <section id="collection-view">
      <div class="collection-head">
        <h2 id="col-title"></h2>
        <button type="button" class="primary" id="add-btn"></button>
      </div>

      <!-- 다 본 것들을 전시하는 곳 -->
      <div class="gallery">
        <div class="gallery-head">
          <p class="gallery-label">ARCHIVE</p>
          <h3 id="gallery-title"></h3>
          <p class="gallery-count" id="gallery-count"></p>
          <select id="gallery-sort" aria-label="전시 순서">
            <option value="date">최근에 본 순</option>
            <option value="stars">별점 높은 순</option>
            <option value="title">제목 순</option>
          </select>
        </div>
        <ul class="wall" id="gallery"></ul>
        <p class="gallery-empty" id="gallery-empty"></p>
      </div>

      <!-- 아직 보는 중인 것들 -->
      <div class="doing">
        <h3 id="doing-title"></h3>
        <ul class="list" id="doing"></ul>
        <p class="empty" id="doing-empty"></p>
      </div>
    </section>

    <!-- 달력 -->
    <section id="calendar-view" hidden>
      <div class="card calendar">
        <div class="cal-head">
          <button type="button" id="prev-month" aria-label="지난달">‹</button>
          <h2 id="month-label"></h2>
          <button type="button" id="next-month" aria-label="다음달">›</button>
        </div>
        <p class="month-summary" id="month-summary"></p>
        <div class="cal-grid cal-week">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div class="cal-grid" id="cal-days"></div>
      </div>

      <div class="day-bar" id="day-bar" hidden>
        <strong id="day-label"></strong>
        <button type="button" id="write-day">이 날 기록 쓰기</button>
        <button type="button" id="clear-day">이번 달 전체 보기</button>
      </div>
      <ul class="list" id="day-list"></ul>
      <p class="empty" id="day-empty"></p>
    </section>

    <!-- 백업 -->
    <section class="backup">
      <button type="button" id="export-btn">기록 백업 파일로 저장</button>
      <label class="file-btn">
        백업 파일 불러오기
        <input type="file" id="import-file" accept="application/json" hidden>
      </label>
    </section>
  </main>

  <!-- 기록 쓰기 창 (버튼을 누르면 화면 위에 떠요) -->
  <dialog id="form-dialog">
    <form id="entry-form">
      <h2 id="form-title">새 기록 남기기</h2>

      <div class="pick" id="type-pick">
        <label><input type="radio" name="type" value="book" checked> 📚 책</label>
        <label><input type="radio" name="type" value="drama"> 📺 드라마</label>
        <label><input type="radio" name="type" value="movie"> 🎬 영화</label>
      </div>

      <div class="pick status-pick">
        <label><input type="radio" name="status" value="doing" checked> <span id="doing-label">읽는 중</span></label>
        <label><input type="radio" name="status" value="done"> <span id="done-label">다 읽었어요</span></label>
      </div>

      <label class="field">
        제목
        <input type="text" id="title" required>
      </label>

      <label class="field">
        <span id="creator-label">지은이</span>
        <input type="text" id="creator">
      </label>

      <label class="field" id="date-field">
        <span id="date-label">다 읽은 날짜</span>
        <input type="date" id="date">
      </label>

      <div class="field">
        <span id="cover-label">책 표지</span>
        <div class="cover-pick">
          <img id="cover-preview" alt="표지 미리보기" hidden>
          <div class="cover-buttons">
            <label class="file-btn">
              사진 고르기
              <input type="file" id="cover-file" accept="image/*" hidden>
            </label>
            <button type="button" id="cover-remove" hidden>사진 빼기</button>
          </div>
        </div>
        <input type="url" id="cover-url" placeholder="또는 인터넷 이미지 주소 붙여넣기">
      </div>

      <div class="field">
        별점
        <div class="star-input" id="star-input" role="radiogroup" aria-label="별점"></div>
      </div>

      <label class="field">
        감상평
        <textarea id="review" rows="5" placeholder="어떤 점이 좋았는지, 기억에 남는 장면이나 문장을 적어보세요"></textarea>
      </label>

      <div class="buttons">
        <button type="submit" class="primary" id="save-btn">저장하기</button>
        <button type="button" id="cancel-btn">닫기</button>
      </div>
    </form>
  </dialog>

  <!-- 전시된 작품을 누르면 뜨는 자세히 보기 창 -->
  <dialog id="detail-dialog">
    <div class="detail" id="detail"></div>
    <div class="buttons">
      <button type="button" id="detail-edit">수정</button>
      <button type="button" id="detail-delete">삭제</button>
      <button type="button" class="primary" id="detail-close">닫기</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
